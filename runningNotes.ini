🔍 Where profile_embs comes from in your current code
Here’s the relevant function from your repo:
ModelForPer.py
Apply
import torch
def obtain_profile_emb(self, his_id, task_embs) :
    
    his_mask = torch.eq(his_id, 0)                # mask empty history IDs
    bsz = his_mask.size()[0]
    his_mask = his_mask.repeat(1, self.mult_k).view(bsz * self.mult_k, -1)

    if (self.training):
        his_embs = self.his_train_emb_table(his_id)  # fetch from train embeddings table
    else:
        his_embs = self.his_dev_emb_table(his_id)    # fetch from dev embeddings table

    his_embs_align = self.align_mlp(his_embs).view(bsz * self.mult_k, -1, self.llm_emb_size)

    # similarity scores between history items and the "task embedding"
    his_weight = torch.bmm(his_embs, task_embs.unsqueeze(-1))
    his_weight = his_weight.masked_fill(his_mask.unsqueeze(-1), -torch.inf)
    his_weight = torch.nn.functional.softmax(his_weight, dim=1)
    his_weight = his_weight.to(his_embs.dtype)

    profile_embs = torch.bmm(torch.transpose(his_embs_align, 1, 2), his_weight).squeeze(-1)

    return profile_embs
🧠 Step-by-step: How this calculates profile_embs
1. `his_id` input
From your dataset loader (PersonalDataset_profile.py), his_id is an array of integer IDs representing which historical interaction embeddings to pull for each sample.  
These IDs correspond to the vectors saved from your embedding-slim-cuda.py script.
On train mode: It pulls them from task_X_train_bge.emb via self.his_train_emb_table.
On eval mode: It pulls from task_X_dev_bge.emb via self.his_dev_emb_table.
2. Fetch history embeddings
self.his_train_emb_table and self.his_dev_emb_table are both frozen nn.Embedding layers created in __init__() from precomputed .emb files:
his_train_emb = torch.cat([torch.zeros(1, self.emb_emb_size), torch.load("../bge_emb/task_" + str(task_id) + "_train_bge.emb")], 0)
self.his_train_emb_table = nn.Embedding(his_train_emb.size()[0], self.emb_emb_size)
self.his_train_emb_table.weight = nn.Parameter(his_train_emb)
for _, param in self.his_train_emb_table.named_parameters():
    param.requires_grad = False
That means his_embs is essentially a (batch_size, history_len, emb_emb_size) tensor of precomputed sentence embeddings.
3. Align history embeddings to LLM space
self.align_mlp is a small feed-forward network that maps from the embedding model’s hidden size to the LLM’s hidden size:
self.align_mlp = nn.Sequential(
    nn.Linear(self.emb_emb_size, self.llm_emb_size * self.mult_k),
    nn.GELU(),
    nn.Linear(self.llm_emb_size * self.mult_k, self.llm_emb_size * self.mult_k)
)
4. Weight history by task relevance
task_embs is computed from the current query via obtain_task_emb() and represents the task-specific embedding vector.
The model computes:
his_weight = torch.bmm(his_embs, task_embs.unsqueeze(-1))
This is essentially a dot product between each history embedding and the task_embs, giving a relevance score per history item.
5. Softmax to get attention weights
Invalid/empty history slots (where his_id == 0) are masked with -inf.
Then a softmax turns scores into attention weights.
6. Weighted sum to get profile embedding
Finally:
profile_embs = torch.bmm(
    torch.transpose(his_embs_align, 1, 2),    # shape: (batch, hidden, seq_len)
    his_weight                                # shape: (batch, seq_len, 1)
).squeeze(-1)                                 # → shape: (batch, hidden)
This gives a single fixed-size vector per user that summarises their whole history, weighted by how relevant each entry is to the current task/query.
📌 TL;DR
The `profile_embs` in your code is:
A relevance-weighted historical embedding vector, where:
History vectors come from precomputed BGE embeddings stored in .emb files.
Weighting is based on similarity (dot product) to the current query’s embedding.
The result is aligned to the LLM’s embedding space.
